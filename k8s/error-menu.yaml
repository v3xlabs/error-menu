apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: error-menu-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-menu
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: error-menu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: error-menu
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: error-menu
          image: ghcr.io/v3xlabs/error-menu:latest
          imagePullPolicy: Always
          env:
            - name: ALLOW_REGISTRATION
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: error-menu-github-oauth
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: error-menu-data
---
apiVersion: v1
kind: Service
metadata:
  name: error-menu
spec:
  selector:
    app.kubernetes.io/name: error-menu
  ports:
    - name: http
      port: 80
      targetPort: http
