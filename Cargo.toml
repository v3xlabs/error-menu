[package]
name = "error-menu"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1"
gix = { version = "0.87.1", features = ["blocking-http-transport-reqwest-rust-tls"] }
jiff = { version = "0.2", features = ["serde"] }
poem = { version = "3.1.12", features = ["cookie"] }
poem-mcpserver = { version = "0.3.1", default-features = false, features = ["streamable-http"] }
poem-openapi = { version = "5.1.16", features = ["swagger-ui"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time"] }
toml = "1.1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rust-embed = "8.12.0"
rand = "0.9"
url = "2"

[dev-dependencies]
insta = "1.48.0"
poem = { version = "3.1.12", features = ["test"] }
