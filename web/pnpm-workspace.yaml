allowBuilds:
  unrs-resolver: false
  vue-demi: true

minimumReleaseAgeExclude:
  - '@scalar/agent-chat@0.12.32'
  - '@scalar/api-client@3.19.1'
  - '@scalar/api-reference@1.69.1'
  - '@scalar/blocks@0.1.18'
  - '@scalar/components@0.29.3'
  - '@scalar/json-magic@0.14.0'
  - '@scalar/oas-utils@0.20.1'
  - '@scalar/openapi-upgrader@0.2.17'
  - '@scalar/sidebar@0.11.3'
  - '@scalar/workspace-store@0.62.0'

# Kobalte's alpha pins solid-js and @solidjs/web to exactly 2.0.0-rc.3, while the vite
# plugin depends on the compiler with a caret, which resolves to rc.8. The newer compiler
# emits calls the rc.3 runtime does not export, so the compiler is held at the runtime.
overrides:
  "@solidjs/babel-plugin": 2.0.0-rc.3
  "@solidjs/compiler": 2.0.0-rc.3
